[project]
name = "finetune-intent-lab"
version = "0.1.0"
description = "Intent classification on Banking77: classic ML vs PyTorch vs LoRA-tuned open-weight LLM vs prompted Claude"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "transformers>=4.56",
    "peft>=0.17",
    "trl>=0.23",
    "datasets>=4.0",
    "accelerate>=1.10",
    "bitsandbytes>=0.47",
    "scikit-learn>=1.7",
    "mlflow>=3.3",
    "pandas>=2.3",
    "anthropic[bedrock]>=0.68",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
